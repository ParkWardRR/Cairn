# Resource limits for a CI runner container on the shared VM. PREPARED, NOT INSTALLED.
#
# Install per runner (phase 3 of the split, when each repository gets its own runner and
# several could otherwise run at once; today there is one):
#
#   mkdir -p ~/.config/systemd/user/container-github-runner.service.d
#   cp cairn-runner-limits.conf ~/.config/systemd/user/container-github-runner.service.d/limits.conf
#   systemctl --user daemon-reload && systemctl --user restart container-github-runner
#
# Why: the VM also serves production (cairn-server, cairn-tsdb, the web layer) and has
# 7.5 GB of RAM. An uncapped parallel build already wedged it once. Measured peaks of a
# full CI run in the runner: ~1.0 GB for the container, ~2.5 GB used on the host, so the
# values below leave headroom for one runner and keep a runaway job away from production.
#
# The user manager delegates the cpu, memory and pids controllers (not io), so there
# are no IO weights here. MemoryHigh throttles and reclaims before MemoryMax kills.
[Service]
MemoryHigh=3G
MemoryMax=4G
CPUWeight=50
TasksMax=4096
