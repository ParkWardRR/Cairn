; Cairn – offline-first car journal
; Target: Freematics ONE+ Model B (ESP32 + GNSS + IMU + microSD + Wi-Fi)
; Uses vendored FreematicsPlus library for proven hardware access.

[env:freematics]
platform  = espressif32
board     = esp-wrover-kit
framework = arduino

board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DENABLE_OBD=1
    -DENABLE_BLE=0
    -DENABLE_MEMS=1

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson

; Bench build: runs a Wi-Fi/DNS/server reachability check at boot and prints the
; result over serial. Flash this to validate connectivity, then reflash
; env:freematics before driving.
[env:freematics-selftest]
extends = env:freematics
build_flags =
    ${env:freematics.build_flags}
    -DCAIRN_NET_SELFTEST=1
