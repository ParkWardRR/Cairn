services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn

  # ── Go ingest service ────────────────────────────────────────────────────

  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bundles:/data/bundles
      - ./certs:/certs:ro
    environment:
      LISTEN_ADDR: ":8443"
      DATABASE_URL: "postgres://cairn:${DB_PASSWORD:-cairn}@postgres:5432/cairn?sslmode=disable"
      BUNDLE_DIR: /data/bundles
      TLS_CERT: /certs/server.pem
      TLS_KEY: /certs/server-key.pem
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8443/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cairn

  # ── Caddy reverse proxy ──────────────────────────────────────────────────

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - ingest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cairn

volumes:
  pgdata:
  bundles:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  cairn:
    driver: bridge
