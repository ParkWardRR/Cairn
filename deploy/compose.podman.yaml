# compose.podman.yaml — Podman-compatible variant of compose.yaml
#
# Differences from the Docker version:
#   - No secrets: block (unsupported in rootless Podman); DB password
#     is passed via POSTGRES_PASSWORD env var instead.
#   - Image references are fully qualified (docker.io/...).
#   - Ingest runs the pre-built binary via a bind-mount instead of
#     building the Dockerfile (avoids needing BuildKit).
#   - Caddy hostname set to cairn.example.lan.

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: docker.io/postgis/postgis:16-3.4
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Caddy reverse proxy ──────────────────────────────────────────────────
  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
