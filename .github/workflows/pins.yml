name: Pins

# The README's table of pins is generated from each repository's contracts.lock, server.lock
# and interop.lock. Nothing else re-runs it, so when a component bumps a pin the table goes
# stale. This checks weekly (and on demand) and, on drift, opens a pull request that
# regenerates the block.
#
# The default token is read-only, so this job asks for exactly two more permissions: to push
# one branch and to open a pull request. If the pull request cannot be opened the run goes
# red, which the owner sees; that is the fallback, and running
#   cd tools && go run ./cmd/pin-dashboard --readme ../README.md
# by hand fixes the table.
#
# Nothing here tags or publishes a contract. A contracts release is a manual act by a
# maintainer.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automation/refresh-pins
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Are the pins current?
        id: check
        working-directory: tools
        run: |
          if go run ./cmd/pin-dashboard --readme ../README.md --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # 1 means "out of date"; anything else (2) is a failure to read, and must stay red
            [ "$status" -eq 1 ] || exit "$status"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the block and open a pull request
        if: steps.check.outputs.drift == 'true'
        run: |
          set -euo pipefail
          (cd tools && go run ./cmd/pin-dashboard --readme ../README.md)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add README.md
          git commit -m "docs: refresh the pins table from the component lock files"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "A pull request for $BRANCH is already open; its branch is updated."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "docs: refresh the pins table" \
            --body "A component repository bumped a pin (\`contracts.lock\`, \`server.lock\` or \`interop.lock\`), so the README's generated block was out of date. Regenerated by \`tools/cmd/pin-dashboard\`. Nothing here tags or publishes a contract."
