name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Self-hosted jobs run only for pushes and for pull requests from branches of THIS
# repository. A fork's pull request would otherwise run its own code on the machine that also
# serves production. tests/check-runners.sh fails the build if a job loses its guard, or if a
# workflow uses pull_request_target or workflow_run.
#
# The front door holds documentation, the contracts and the tooling that built the other
# repositories. contracts.yml and docs.yml check the first two; this file checks the third.
jobs:
  runner-policy:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every job is on the self-hosted runner
        run: tests/check-runners.sh

      - name: The policy check can actually fail
        run: tests/check-runners-selftest.sh

  # The tools that outlived the split: the contract checker, the link checker and the pin
  # dashboard. (The migration tooling that carved the repositories apart is gone; it is in
  # this repository's history and in the archive repository.)
  tools:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Vet and test
        working-directory: tools
        run: go vet ./... && go test ./...
