name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-zig:
    runs-on: [self-hosted, cairn]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build common
        working-directory: zig/common
        run: zig build

      - name: Test common
        working-directory: zig/common
        run: zig build test

      - name: Build bundle
        working-directory: zig/bundle
        run: zig build

      - name: Build CLI
        working-directory: zig/cli
        run: zig build

      - name: CLI smoke test
        working-directory: zig/cli
        run: |
          ./zig-out/bin/tripctl generate --duration-minutes 5 --output /tmp/ci-test-trip
          ./zig-out/bin/tripctl validate /tmp/ci-test-trip
          ./zig-out/bin/tripctl inspect /tmp/ci-test-trip
          ./zig-out/bin/tripctl export-gpx /tmp/ci-test-trip --output /tmp/ci-test.gpx
          rm -rf /tmp/ci-test-trip /tmp/ci-test.gpx

  build-go:
    runs-on: [self-hosted, cairn]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build ingest service
        working-directory: zig/ingest
        run: go build ./cmd/ingestd/

      - name: Vet
        working-directory: zig/ingest
        run: go vet ./...

  build-rust:
    runs-on: [self-hosted, cairn]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build emulator
        working-directory: emulator
        run: cargo build --release

      - name: Verify binary
        run: ./emulator/target/release/cairn-emulator --help

  emulator-test:
    runs-on: [self-hosted, cairn]
    needs: [build-go, build-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build emulator
        working-directory: emulator
        run: cargo build --release

      - name: Generate and validate fixtures
        run: |
          ./emulator/target/release/cairn-emulator \
            --scenario normal_commute \
            --speedup 1000 \
            --seed 12345 \
            --output /tmp/ci-fixtures
          # Verify binary alignment and hash integrity
          for d in /tmp/ci-fixtures/cairn-emulator-01/*/; do
            [ -f "$d/samples.bin" ] || continue
            sb=$(wc -c < "$d/samples.bin" | tr -d ' ')
            if [ $((sb % 32)) -ne 0 ]; then
              echo "FAIL: samples.bin not 32-byte aligned in $d"
              exit 1
            fi
            while IFS='  ' read -r expected name; do
              actual=$(shasum -a 256 "$d/$name" | cut -d' ' -f1)
              if [ "$expected" != "$actual" ]; then
                echo "FAIL: hash mismatch for $name in $d"
                exit 1
              fi
            done < "$d/sha256sums.txt"
            echo "OK: $d ($((sb / 32)) GNSS samples)"
          done
          rm -rf /tmp/ci-fixtures

      - name: Emulator scenarios against live ingest
        run: |
          if curl -sf --max-time 5 http://localhost:8443/api/v1/health >/dev/null 2>&1; then
            for scenario in normal_commute short_errand power_loss_upload; do
              ./emulator/target/release/cairn-emulator \
                --scenario "$scenario" \
                --server http://localhost:8443 \
                --speedup 1000 \
                --output /tmp/ci-emulator-output \
                --seed $RANDOM
            done
            rm -rf /tmp/ci-emulator-output
          else
            echo "Ingest service not running -- skipping emulator tests"
          fi

  build-gleam:
    runs-on: [self-hosted, cairn]
    steps:
      - uses: actions/checkout@v4

      - name: Build trip-orchestrator
        working-directory: gleam/trip-orchestrator
        run: gleam build

      - name: Test trip-orchestrator
        working-directory: gleam/trip-orchestrator
        run: gleam test

  validate-pwa:
    runs-on: [self-hosted, cairn]
    steps:
      - uses: actions/checkout@v4

      - name: Validate PWA files exist
        run: |
          for f in pwa/index.html pwa/app.js pwa/style.css pwa/manifest.json pwa/sw.js; do
            test -f "$f" || { echo "FAIL: missing $f"; exit 1; }
          done
          echo "All PWA files present"

  integration-test:
    runs-on: [self-hosted, cairn]
    needs: [build-go, build-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build emulator
        working-directory: emulator
        run: cargo build --release

      - name: Smoke test against live ingest
        run: |
          if curl -sf --max-time 5 http://localhost:8443/api/v1/health >/dev/null 2>&1; then
            bash tests/smoke_test.sh http://localhost:8443
          else
            echo "Ingest service not running -- skipping integration tests"
          fi
