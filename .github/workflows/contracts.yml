name: Contracts

# The Cairn Vehicle Data Protocols (contracts/): specs, vectors, schemas. This checks what
# is objectively checkable about them. Whether a vector is CORRECT is decided by the
# independent implementations (Go, Rust, C) running it in their own repositories, and the
# byte-level vectors are regenerated and diffed against the pinned release by the server's CI.
#
# Nothing here tags or publishes. A contracts release is a manual act by a maintainer.
on:
  push:
    branches: [main]
    paths: ['contracts/**', 'tools/contractcheck/**', 'tools/cmd/contract-check/**',
            'tools/enginelang/**', 'tools/cmd/engine-check/**',
            'tools/modulecheck/**', 'tools/cmd/module-check/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [main]
    paths: ['contracts/**', 'tools/contractcheck/**', 'tools/cmd/contract-check/**',
            'tools/enginelang/**', 'tools/cmd/engine-check/**',
            'tools/modulecheck/**', 'tools/cmd/module-check/**', '.github/workflows/contracts.yml']

jobs:
  contracts:
    runs-on: [self-hosted, cairn]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: The checker itself passes its tests
        working-directory: tools
        run: go test ./contractcheck/

      - name: Every protocol version is complete and valid
        working-directory: tools
        run: go run ./cmd/contract-check ../contracts

      - name: The engine formula language agrees with its vectors
        # A third, independent implementation of cairn.engine/v1-draft, written from
        # contracts/engine/v1/spec.md rather than ported from the firmware's Rust. Two
        # implementations written together agree on the mistakes they were written with;
        # this is the one that makes the vectors evidence. See contracts/engine/v1/README.md.
        working-directory: tools
        run: |
          go test ./enginelang/
          go run ./cmd/engine-check

      - name: Module manifests agree with their vectors, and the shared vocabulary has not drifted
        # module/v1 names engine/v1's capture-field enum and store/v1's columns. engine/v1
        # exists because two copies of one vocabulary drifted apart; CheckVocabulary is the
        # guard against repeating that with three. See contracts/module/v1/README.md.
        working-directory: tools
        run: |
          go test ./modulecheck/
          go run ./cmd/module-check
